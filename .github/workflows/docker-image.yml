name: LibreLinkUp CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production using a previously published image
        type: boolean
        default: false
      image_digest:
        description: ECR digest (leave empty to reuse the running image)
        type: string
  push:
    branches: [my-main]
  pull_request:
    branches: [my-main]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.deploy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ARM64 image
        run: docker build -t librelinkup:ci .
      - name: Validate ECR publishing settings
        if: github.ref == 'refs/heads/my-main'
        id: ecr
        env:
          ROLE_ARN: ${{ vars.AWS_ECR_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        shell: sh
        run: |
          if ! printf '%s\n' "$ROLE_ARN" |
            grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+$'; then
            echo 'AWS_ECR_ROLE_ARN must identify an AWS IAM role.' >&2
            exit 1
          fi
          if [ -z "$REGION" ] || [ -z "$REPOSITORY" ]; then
            echo 'Set AWS_REGION and ECR_REPOSITORY.' >&2
            exit 1
          fi

          role_suffix=${ROLE_ARN#arn:aws:iam::}
          account_id=${role_suffix%%:*}
          printf 'account-id=%s\n' "$account_id" >> "$GITHUB_OUTPUT"
      - uses: "aws-actions/configure-aws-credentials@\
          e1253824e5c10ff9df46874f81ed3ec929e19cfd" # v6.3.0
        if: github.ref == 'refs/heads/my-main'
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ steps.ecr.outputs.account-id }}
      - name: Publish by immutable digest
        if: github.ref == 'refs/heads/my-main'
        env:
          AWS_ACCOUNT_ID: ${{ steps.ecr.outputs.account-id }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        shell: sh
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$ECR_REPOSITORY:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          password=$(aws ecr get-login-password)
          printf '%s\n' "$password" |
            docker login --username AWS --password-stdin "$registry"
          unset password

          docker tag librelinkup:ci "$image"
          docker push "$image"
          reference=$(docker inspect \
            --format '{{index .RepoDigests 0}}' "$image")
          digest=${reference##*@}
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "Couldn't read the published image digest." >&2
            exit 1
          fi
          printf '%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy
      && github.ref == 'refs/heads/my-main'
      && github.repository == 'oklitovchenko/nightscout-librelink-up'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: "aws-actions/configure-aws-credentials@\
          e1253824e5c10ff9df46874f81ed3ec929e19cfd" # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy LibreLinkUp
        env:
          RUNTIME_CONFIG: ${{ vars.LIBRELINKUP_RUNTIME_OPTIONS_JSON }}
          RUNTIME_SECRET: ${{ secrets.LIBRELINKUP_RUNTIME_JSON }}
          TARGET_INSTANCE: ${{ vars.NIGHTSCOUT_INSTANCE_ID }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: sh .github/scripts/deploy-production.sh
